name: Feature request
description: Suggest an improvement to the model, tooling, or web UI
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do, and what makes it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? Sketch the interface or behaviour.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Goal model / calibration
        - Simulation / bracket
        - Value betting / paper trading
        - Intel pipeline / MCP
        - Web UI
        - CLI / tooling
        - Docs
        - Other
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
